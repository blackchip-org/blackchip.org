<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>blackchip.org</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<link rel="shortcut icon" href="images/favicon.ico">
<style>
  @font-face {
    font-family: "New Rocker";
    src: url("fonts/NewRocker-Regular.ttf") format("truetype");
  }

  @font-face {
    font-family: "Alfa Slab One";
    src: url("fonts/AlfaSlabOne-Regular.ttf") format("truetype");
  }

  @font-face {
    font-family: "IBM Plex Sans";
    src: url("fonts/IBMPlexSans-Variable.ttf") format("truetype-variations");
    font-weight: 100 700;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: black;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: "IBM Plex Sans", sans-serif;
    padding: 2rem 1rem;
  }

  header {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header img {
    width: 100px;
    height: 100px;
    margin-bottom: 1rem;
  }

  header h1 {
    margin: 0 0 2rem;
    font-family: "Alfa Slab One", sans-serif;
    font-size: 2.5rem;
    font-weight: normal;
  }

  .links {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }

  .links a {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 0.75rem;
    color: white;
    text-decoration: none;
  }

  .links img {
    width: 64px;
    height: 64px;
  }

  .links .title {
    font-family: "New Rocker", sans-serif;
    font-size: 1.75rem;
  }

  .meta-links {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 0.5rem;
    margin-top: 2rem;
    font-size: 1.25rem;
  }

  .meta-links .separator {
    color: #666;
  }

  .meta-links a {
    color: white;
    text-decoration: none;
  }

  hr {
    width: 200px;
    max-width: 100%;
    border: none;
    border-top: 1px solid #555;
    margin: 2rem 0;
  }
</style>
</head>
<body>
  <header>
    <img src="images/chip100.svg" alt="Blackchip icon">
    <h1>blackchip.org</h1>
  </header>
  <hr>
  <ul class="links">
    <li>
      <a href="https://blackchip.org/rumble31">
        <img src="images/rumble31.png" alt="Rumble 31 icon">
        <span class="title">Rumble 31</span>
      </a>
    </li>
  </ul>
  <hr>
  <div class="meta-links">
    <a href="licenses.html">Licenses</a>
    <span class="separator">&middot;</span>
    <a href="mailto:games@blackchip.org">Contact: games@blackchip.org</a>
  </div>
</body>
</html>
