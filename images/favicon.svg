<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="chipBody" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="55%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
  </defs>

  <!-- chip face -->
  <circle cx="32" cy="32" r="30" fill="url(#chipBody)" stroke="#000" stroke-width="1"/>

  <!-- edge spots (simplified, bolder for small sizes) -->
  <g fill="#f5f5f5">
    <g id="spotGroup">
      <rect x="27.5" y="2" width="9" height="10" rx="1.5"/>
    </g>
    <use href="#spotGroup" transform="rotate(90 32 32)"/>
    <use href="#spotGroup" transform="rotate(180 32 32)"/>
    <use href="#spotGroup" transform="rotate(270 32 32)"/>
  </g>

  <!-- inner disc -->
  <circle cx="32" cy="32" r="20" fill="#111111" stroke="#d4af37" stroke-width="2"/>

  <!-- text -->
  <text x="32" y="40" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="16" fill="#f5f5f5">100</text>
</svg>
